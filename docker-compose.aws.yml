services:
  pg:
    image: postgres:17-alpine
    container_name: mini_insta_db
    restart: always
    environment:
      POSTGRES_USER: ${VITE_PG_USER}
      POSTGRES_PASSWORD: ${VITE_PG_PASSWORD}
      POSTGRES_DB: ${VITE_PG_DBNAME}
    volumes:
      - mini_insta_pg_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mini_insta_api
    restart: always
    environment:
      DOCKER_ENV: "true"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3101:3101"
    env_file:
      - .env
    depends_on:
      - pg

volumes:
  mini_insta_pg_data:
