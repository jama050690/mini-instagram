# mini-instagram API uchun HOST-LEVEL nginx server block namunasi.
#
# Bu fayl serveringizda apt/systemd orqali o'rnatilgan MAVJUD nginx uchun.
# Docker konteyner emas — mavjud loyihalaringizning nginx sozlamalariga
# TEGMAYDI, faqat yangi domen (insta-api.jamshiddin.uz) uchun alohida
# server block qo'shadi.
#
# O'RNATISH:
#   1. insta-api.jamshiddin.uz o'rniga o'z domeningizni qo'ying (2 joyda).
#      "api.jamshiddin.uz" allaqachon boshqa loyiha (PrimeAvto) tomonidan
#      band, shuning uchun boshqa nom tanlang.
#   2. Bu faylni serverga nusxalang:
#        sudo cp deploy/nginx/host/insta-api.example.conf \
#          /etc/nginx/sites-available/insta-api.jamshiddin.uz
#   3. Yoqing:
#        sudo ln -s /etc/nginx/sites-available/insta-api.jamshiddin.uz \
#          /etc/nginx/sites-enabled/insta-api.jamshiddin.uz
#   4. Tekshiring va qayta yuklang:
#        sudo nginx -t && sudo systemctl reload nginx
#   5. SSL sertifikat oling (mavjud sertifikatlaringizga tegmaydi,
#      faqat shu domen uchun yangisini qo'shadi):
#        sudo certbot --nginx -d insta-api.jamshiddin.uz
#      Certbot ushbu faylni avtomatik https ga moslab qayta yozadi.

server {
    server_name insta-api.jamshiddin.uz;

    client_max_body_size 64m;

    # Backend Docker konteyneri faqat 127.0.0.1 ga bog'langan
    # (docker-compose.aws.yml dagi "127.0.0.1:3101:3101" bilan mos).
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
